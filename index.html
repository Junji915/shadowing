<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Shadowing Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4F6EF7;
      --primary-dark: #3A56D4;
      --accent: #FF6B6B;
      --accent-dark: #e05555;
      --success: #4CAF50;
      --bg: #F0F4FF;
      --card: #FFFFFF;
      --text: #1A1D2E;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --shadow: 0 4px 20px rgba(79,110,247,0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      padding: 16px 20px 14px;
      padding-top: calc(16px + env(safe-area-inset-top));
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(79,110,247,0.3);
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    /* Category Tabs */
    .category-bar {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: white;
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Progress */
    .progress-bar-wrap {
      padding: 10px 16px 0;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Main Card */
    .main {
      padding: 14px 16px 100px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px 20px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .scene-tag {
      display: inline-block;
      background: #EEF2FF;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .sentence-en {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 10px;
      word-break: break-word;
    }

    .sentence-ja {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .sentence-ja.show { display: block; }

    .translate-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    /* Pronunciation hint */
    .phonetics {
      font-size: 13px;
      color: #9CA3AF;
      font-style: italic;
      margin-bottom: 4px;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 14px 10px;
      border-radius: 14px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn-icon { font-size: 22px; line-height: 1; }

    .btn-listen {
      background: var(--primary);
      color: white;
      grid-column: 1 / -1;
      flex-direction: row;
      gap: 8px;
      padding: 16px;
    }
    .btn-listen .btn-icon { font-size: 20px; }

    .btn-record {
      background: #FFF0F0;
      color: var(--accent);
      border: 1.5px solid #FFD6D6;
    }
    .btn-record.recording {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,107,107,0); }
    }

    .btn-play {
      background: #F0FFF4;
      color: #16A34A;
      border: 1.5px solid #D1FAE5;
    }
    .btn-play:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Navigation */
    .nav-row {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      flex: 1;
      background: white;
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .btn-nav:active { transform: scale(0.97); background: #F3F4F6; }

    /* Speed control */
    .speed-card {
      background: white;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
    }
    .speed-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .speed-value {
      color: var(--primary);
      font-size: 15px;
      font-weight: 700;
    }
    .speed-slider {
      width: 100%;
      -webkit-appearance: none;
      height: 5px;
      border-radius: 99px;
      background: var(--border);
      outline: none;
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(79,110,247,0.4);
    }

    /* Tips */
    .tip-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #92400E;
      line-height: 1.5;
    }
    .tip-box strong { color: #78350F; }

    /* Status message */
    .status-msg {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 8px;
      min-height: 28px;
      transition: color 0.3s;
    }
    .status-msg.ok { color: var(--success); }
    .status-msg.err { color: var(--accent); }

    /* Completion banner */
    .completion-banner {
      display: none;
      background: linear-gradient(135deg, #4F6EF7, #7C3AED);
      color: white;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .completion-banner.show { display: block; }
    .completion-banner h2 { font-size: 26px; margin-bottom: 8px; }
    .completion-banner p { font-size: 15px; opacity: 0.9; margin-bottom: 18px; }
    .btn-restart {
      background: white;
      color: var(--primary);
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🎙️ English Shadowing</h1>
  <p>中級 — 約1分間パッセージ × 18本</p>
</div>

<!-- Category Tabs -->
<div class="category-bar" id="categoryBar"></div>

<!-- Progress -->
<div class="progress-bar-wrap">
  <div class="progress-info">
    <span id="progressLabel">1 / 10</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="main" id="mainContent">

  <!-- Sentence Card -->
  <div class="card" id="sentenceCard">
    <div class="scene-tag" id="sceneTag">Business</div>
    <div class="phonetics" id="phonetics"></div>
    <div class="sentence-en" id="sentenceEn">Loading...</div>
    <button class="translate-btn" id="translateBtn" onclick="toggleTranslation()">
      <span>🇯🇵</span> 日本語訳を見る
    </button>
    <div class="sentence-ja" id="sentenceJa"></div>
  </div>

  <!-- Listen Button -->
  <div class="card" style="padding: 14px;">
    <div class="controls">
      <button class="btn btn-listen" id="listenBtn" onclick="playTTS()">
        <span class="btn-icon">🔊</span>
        <span>お手本を聞く</span>
      </button>
      <button class="btn btn-record" id="recordBtn" onclick="toggleRecording()">
        <span class="btn-icon">🎤</span>
        <span id="recordLabel">録音開始</span>
      </button>
      <button class="btn btn-play" id="playbackBtn" onclick="playRecording()" disabled>
        <span class="btn-icon">▶️</span>
        <span>自分の声</span>
      </button>
    </div>
    <div class="status-msg" id="statusMsg">👆 まずお手本を聞いてからシャドーイング！</div>
  </div>

  <!-- Speed Control -->
  <div class="speed-card" style="margin-bottom:14px;">
    <div class="speed-label">
      <span>🐢 再生速度</span>
      <span class="speed-value" id="speedDisplay">1.0×</span>
    </div>
    <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="1.5" step="0.1" value="1.0"
      oninput="updateSpeed(this.value)">
  </div>

  <!-- Navigation -->
  <div class="nav-row" style="margin-bottom:14px;">
    <button class="btn-nav" onclick="prevSentence()">← 前へ</button>
    <button class="btn-nav" onclick="nextSentence()" id="nextBtn">次へ →</button>
  </div>

  <!-- Tip -->
  <div class="tip-box" id="tipBox">
    <strong>💡 コツ：</strong> お手本を聞きながら、または直後に同じリズム・イントネーションで声に出しましょう。
  </div>

  <!-- Completion -->
  <div class="completion-banner" id="completionBanner">
    <h2>🎉 セット完了！</h2>
    <p>全フレーズお疲れさまでした。<br>もう一度練習して定着させよう！</p>
    <button class="btn-restart" onclick="restartSet()">もう一度チャレンジ</button>
  </div>

</div>

<script>
  // ===== DATA =====
  const categories = {
    "ビジネス": [
      {
        en: "Good morning, everyone. Thank you for joining today's project update meeting. I'd like to start by reviewing the progress we've made over the past two weeks. The development team has successfully completed the first phase of the project, and we're currently on track to meet our quarterly deadline. However, I do want to flag a potential issue with the budget. We've spent about sixty percent of our allocated funds, and we still have a significant amount of work remaining. I'd like to propose that we schedule a separate meeting with the finance team to discuss possible solutions. In the meantime, I'll prepare a detailed report outlining our current spending and projected costs. Does anyone have any questions or concerns before we move on to the next agenda item?",
        ja: "おはようございます、皆さん。本日のプロジェクト進捗会議にご参加いただきありがとうございます。まず、この2週間の進捗を振り返りたいと思います。開発チームはプロジェクトの第一フェーズを無事完了し、現在四半期の締め切りに向けて順調に進んでいます。ただし、予算に関して懸念事項をお伝えしたいと思います。割り当て資金の約60%を使用しており、まだかなりの作業が残っています。財務チームと別途ミーティングを設けて、解決策を検討することを提案したいと思います。その間に、現在の支出と予測コストをまとめた詳細レポートを作成します。次の議題に移る前に、ご質問やご懸念はありますか？",
        scene: "📊 Progress Meeting",
        tip: "「I'd like to flag」は問題を注意喚起するビジネス表現。「on track」は「予定通り進んでいる」という意味。全体の流れを意識してリズムよく読もう。"
      },
      {
        en: "Thank you for taking the time to meet with us today. We really appreciate the opportunity to present our proposal. As you can see from the slide, our solution is designed to address the key challenges your company has been facing. By implementing our software, you can expect to reduce operational costs by up to thirty percent within the first year. Additionally, our system integrates seamlessly with your existing infrastructure, which means there will be minimal disruption during the transition period. We've already helped several companies in your industry achieve similar results, and we're confident we can do the same for you. I'd be happy to walk you through a live demonstration after this presentation. Please feel free to ask any questions at any time.",
        ja: "本日はお時間をいただきありがとうございます。提案をプレゼンする機会をいただき、大変感謝しております。スライドをご覧いただければわかるように、私たちのソリューションは貴社が直面している主要な課題に対応するために設計されています。私たちのソフトウェアを導入することで、初年度に運営コストを最大30%削減できることが期待できます。さらに、私たちのシステムは既存のインフラとシームレスに統合されるため、移行期間中の混乱は最小限に抑えられます。すでに御社と同じ業界の複数の企業が同様の成果を上げており、御社でも同じことができると確信しています。プレゼン後にライブデモを喜んでご案内します。ご質問はいつでもどうぞ。",
        scene: "💼 Client Presentation",
        tip: "「seamlessly integrates」や「minimal disruption」はIT・ビジネス提案でよく使うフレーズ。自信を持ったトーンで、強調する単語（costs、thirty percent など）を少し強めに読もう。"
      },
      {
        en: "Thank you for the opportunity to interview for this position. I've been working in marketing for the past seven years, and I've developed strong skills in both digital and traditional marketing strategies. In my previous role at a mid-sized technology company, I led a team of eight people and was responsible for managing an annual marketing budget of approximately two million dollars. One of my proudest achievements was launching a social media campaign that increased brand awareness by forty percent in just three months. I'm particularly excited about this opportunity because your company's approach to customer engagement aligns perfectly with my professional values. I'm eager to bring my experience and passion to your team, and I'm confident that I can make a meaningful contribution from day one.",
        ja: "このポジションへの面接の機会をいただきありがとうございます。私はこれまで7年間マーケティングの仕事をしており、デジタルと従来型のマーケティング戦略の両方で強いスキルを身につけてきました。以前の中規模テクノロジー企業での役割では、8人のチームをリードし、年間約200万ドルのマーケティング予算の管理を担当していました。最も誇りに思う成果の一つは、わずか3ヶ月でブランド認知度を40%向上させたソーシャルメディアキャンペーンを立ち上げたことです。御社のカスタマーエンゲージメントへのアプローチが私のプロとしての価値観と完全に一致しているため、この機会に特に興奮しています。経験と情熱をチームに持ち込みたいと思っており、初日から意義ある貢献ができると確信しています。",
        scene: "🎯 Job Interview",
        tip: "面接では自信あるトーンが大切。数字（seven years、forty percent）は明確に、「I'm confident that」は少し力を込めて言おう。"
      },
      {
        en: "Good afternoon. Thank you for coming in today. As you know, we're here to discuss your performance over the past six months. Overall, I'm very pleased with the progress you've made. Your project management skills have improved significantly, and the feedback from your team members has been overwhelmingly positive. You've consistently met your deadlines, and the quality of your work has been excellent. However, there are a couple of areas where I'd like to see further development. First, I think you could improve your communication with other departments. There have been a few instances where information wasn't shared in a timely manner, which caused some delays. Second, I'd like you to take on more of a leadership role in client meetings. You have the skills, and I think it's time to put them to better use.",
        ja: "こんにちは。本日はお越しいただきありがとうございます。ご存知の通り、この6ヶ月間のパフォーマンスについてお話しするためにお集まりいただきました。全体的に、あなたの成長にとても満足しています。プロジェクト管理スキルが大幅に向上し、チームメンバーからのフィードバックも非常にポジティブです。常に締め切りを守り、仕事の質も素晴らしいものがあります。ただ、さらなる成長を期待したい点が2つあります。まず、他部署とのコミュニケーションを改善できると思います。情報共有が遅れ、いくつかの遅延を引き起こした事例がありました。次に、クライアントミーティングでより主導的な役割を担っていただきたいと思います。スキルは十分にありますので、そろそろ活かす時期だと思います。",

        tip: "人事評価の会話では、ポジティブな点を先に述べてから改善点に移る「サンドイッチ式」が定番。「However」や「I'd like to see」などの切り替えフレーズに注目しよう。"
      },
      {
        en: "Thank you for sending over your proposal. We've had a chance to review it carefully, and while we're very interested in moving forward, there are a few points we'd like to discuss. First, regarding the pricing — the current rate is slightly above our budget for this quarter. We were hoping to bring the cost down by around fifteen percent. In exchange, we'd be happy to commit to a twelve-month contract rather than the six months originally discussed. Additionally, we'd like to include a service level agreement that guarantees a response time of no more than four hours for any critical issues. We believe these terms are fair for both sides and would allow us to build a strong long-term partnership. Would you be open to discussing these adjustments at your earliest convenience?",
        ja: "提案書をお送りいただきありがとうございます。慎重に検討する機会を持ちましたが、前向きに進めることに大変関心があります。ただ、いくつか話し合いたい点があります。まず、価格設定について。現在の料金は今四半期の予算より若干高めです。約15%のコスト削減を希望しています。その代わり、当初の6ヶ月ではなく12ヶ月契約にコミットすることを喜んで検討します。さらに、重大な問題に対して4時間以内の対応時間を保証するサービスレベル契約を含めたいと思います。これらの条件は双方にとって公平であり、強固な長期的パートナーシップを構築できると確信しています。できるだけ早くこの調整について話し合う機会をいただけますか？",

      {

        ja: "ようこそ！あなたがチームに加わることをとても嬉しく思います。最初の数週間はオンボーディングのサポート担当を務めますので、何でも遠慮なく聞いてください。まず、ここでの仕事の進め方を簡単に説明します。チームは毎朝9時にスタンドアップミーティングを開催しており、通常15分ほどです。足並みをそろえ、問題を早期に発見するのに最適な場です。毎週金曜の午後には全社ミーティングにも招待されます。最初の1ヶ月はシステムやプロセスに慣れることに集中していただきたいと思います。ほとんどの疑問に答えられる詳細なオンボーディング文書も用意しています。その後、徐々にクライアントプロジェクトにも関わっていただきます。始める前に何かご質問はありますか？",
        scene: "🌟 Onboarding",
        tip: "新入社員のオンボーディング会話は温かく明確なトーンが大切。「don't hesitate to」「gradually」などのフレーズは職場英語の定番。リズムよく読もう。"

    "旅行": [

  // ===== STATE =====
  let currentCat = "ビジネス";
  let currentIdx = 0;
  let sentences = [];
  let speechSpeed = 1.0;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordedBlob = null;
  let recordedUrl = null;
  let isRecording = false;
  let isSpeaking = false;
  let currentAudio = null;
  let chunkQueue = [];

  // ===== INIT =====
  function init() {
    buildCategoryTabs();
    loadCategory("ビジネス");
  }

  function buildCategoryTabs() {
    const bar = document.getElementById("categoryBar");
    bar.innerHTML = "";
    Object.keys(categories).forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (cat === currentCat ? " active" : "");
      btn.textContent = cat;
      btn.onclick = () => loadCategory(cat);
      bar.appendChild(btn);
    });
  }

  function loadCategory(cat) {
    currentCat = cat;
    currentIdx = 0;
    sentences = categories[cat];
    // Update tab styles
    document.querySelectorAll(".cat-btn").forEach(b => {
      b.classList.toggle("active", b.textContent === cat);
    });
    document.getElementById("completionBanner").classList.remove("show");
    document.getElementById("sentenceCard").style.display = "";
    clearRecording();
    renderSentence();
  }

  function renderSentence() {
    if (currentIdx >= sentences.length) {
      showCompletion();
      return;
    }
    const s = sentences[currentIdx];
    document.getElementById("sceneTag").textContent = s.scene;
    document.getElementById("phonetics").textContent = s.phonetics || "";
    document.getElementById("sentenceEn").textContent = s.en;
    document.getElementById("sentenceJa").textContent = s.ja;
    document.getElementById("sentenceJa").classList.remove("show");
    document.getElementById("translateBtn").innerHTML = '<span>🇯🇵</span> 日本語訳を見る';
    document.getElementById("tipBox").innerHTML = `<strong>💡 コツ：</strong> ${s.tip}`;
    updateProgress();
    clearRecording();
    setStatus("👆 まずお手本を聞いてからシャドーイング！", "");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateProgress() {
    const total = sentences.length;
    const done = currentIdx;
    const pct = Math.round((done / total) * 100);
    document.getElementById("progressLabel").textContent = `${done + 1} / ${total}`;
    document.getElementById("progressPct").textContent = `${pct}%`;
    document.getElementById("progressFill").style.width = pct + "%";
  }

  // ===== TTS（Audio要素 + StreamElements API）=====
  // speechSynthesis はiOSで不安定なため、Audio要素方式に切り替え

  function buildChunks(text, maxLen) {
    // テキストを単語境界でmaxLen文字以内に分割
    const words = text.split(' ');
    const chunks = [];
    let chunk = '';
    for (const word of words) {
      const next = chunk ? chunk + ' ' + word : word;
      if (next.length > maxLen && chunk) {
        chunks.push(chunk);
        chunk = word;
      } else {
        chunk = next;
      }
    }
    if (chunk) chunks.push(chunk);
    return chunks;
  }

  function playTTS() {
    const btn = document.getElementById("listenBtn");

    // 再生中なら停止
    if (isSpeaking) {
      isSpeaking = false;
      chunkQueue = [];
      if (currentAudio) { currentAudio.pause(); currentAudio.src = ""; }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      btn.innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
      setStatus("⏹ 停止しました", "");
      return;
    }

    const s = sentences[currentIdx];
    isSpeaking = true;
    btn.innerHTML = '<span class="btn-icon">⏸️</span><span>再生中...</span>';
    setStatus("🎧 音声を読み込み中...", "");

    // 300文字以内のチャンクに分割（StreamElements APIの制限対応）
    chunkQueue = buildChunks(s.en, 300);

    // Audio要素をここで生成（ユーザーのタップ操作から直接呼ぶことでiOSの制限を回避）
    if (!currentAudio) currentAudio = new Audio();
    currentAudio.playbackRate = Math.min(Math.max(speechSpeed, 0.5), 2.0);

    playNextChunk(); // タップから同期的に呼ぶ
  }

  function playNextChunk() {
    if (!isSpeaking || chunkQueue.length === 0) {
      if (isSpeaking) {
        isSpeaking = false;
        if (currentAudio) currentAudio.src = "";
        document.getElementById("listenBtn").innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
        setStatus("✅ 聞けた！今度は自分でシャドーイング🎤", "ok");
      }
      return;
    }

    const chunk = chunkQueue.shift();
    const url = "https://api.streamelements.com/kappa/v2/speech?voice=Brian&text="
                + encodeURIComponent(chunk);

    currentAudio.oncanplay = () => {
      setStatus("🎧 音声を聞いています...", "");
    };
    currentAudio.onended = playNextChunk;
    currentAudio.onerror = () => {
      // API失敗 → speechSynthesisにフォールバック
      speakWithFallback();
    };

    currentAudio.src = url;
    currentAudio.play().catch(() => speakWithFallback());
  }

  function speakWithFallback() {
    if (!isSpeaking) return;
    chunkQueue = [];
    if (!window.speechSynthesis) {
      isSpeaking = false;
      document.getElementById("listenBtn").innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
      setStatus("⚠️ 音声エラー。ネット接続と音量を確認してください", "err");
      return;
    }
    const s = sentences[currentIdx];
    const utter = new SpeechSynthesisUtterance(s.en);
    utter.lang = "en-US";
    utter.rate = speechSpeed;
    utter.onend = () => {
      isSpeaking = false;
      document.getElementById("listenBtn").innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
      setStatus("✅ 聞けた！今度は自分でシャドーイング🎤", "ok");
    };
    utter.onerror = () => {
      isSpeaking = false;
      document.getElementById("listenBtn").innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
      setStatus("⚠️ 音声エラー", "err");
    };
    window.speechSynthesis.speak(utter);
  }

  // ===== RECORDING =====
  async function toggleRecording() {
    if (isRecording) {
      stopRecording();
    } else {
      await startRecording();
    }
  }

  // iOS fix: detect supported audio MIME type
  function getSupportedMimeType() {
    if (typeof MediaRecorder === "undefined") return null;
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg", ""];
    for (const type of types) {
      try {
        if (type === "" || MediaRecorder.isTypeSupported(type)) return type;
      } catch(e) {}
    }
    return "";
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      const mimeType = getSupportedMimeType();
      const options = mimeType ? { mimeType } : {};
      mediaRecorder = new MediaRecorder(stream, options);
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      const actualType = mimeType || "audio/webm";
      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(audioChunks, { type: actualType });
        recordedUrl = URL.createObjectURL(recordedBlob);
        document.getElementById("playbackBtn").disabled = false;
        setStatus("✅ 録音完了！▶️ 自分の声を確認しよう", "ok");
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      const btn = document.getElementById("recordBtn");
      btn.classList.add("recording");
      document.getElementById("recordLabel").textContent = "録音中...";
      setStatus("🔴 録音中... もう一度タップで停止", "");
    } catch(e) {
      setStatus("⚠️ マイクへのアクセスを許可してください", "err");
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    isRecording = false;
    const btn = document.getElementById("recordBtn");
    btn.classList.remove("recording");
    document.getElementById("recordLabel").textContent = "録音開始";
  }

  function playRecording() {
    if (!recordedUrl) return;
    const audio = new Audio(recordedUrl);
    audio.play();
    setStatus("▶️ あなたの録音を再生中...", "");
    audio.onended = () => setStatus("💬 お手本と比べてみよう！", "ok");
  }

  function clearRecording() {
    isRecording = false;
    audioChunks = [];
    recordedBlob = null;
    if (recordedUrl) {
      URL.revokeObjectURL(recordedUrl);
      recordedUrl = null;
    }
    const btn = document.getElementById("recordBtn");
    btn.classList.remove("recording");
    document.getElementById("recordLabel").textContent = "録音開始";
    document.getElementById("playbackBtn").disabled = true;
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    mediaRecorder = null;
  }

  // ===== TRANSLATION =====
  function toggleTranslation() {
    const ja = document.getElementById("sentenceJa");
    const btn = document.getElementById("translateBtn");
    if (ja.classList.contains("show")) {
      ja.classList.remove("show");
      btn.innerHTML = '<span>🇯🇵</span> 日本語訳を見る';
    } else {
      ja.classList.add("show");
      btn.innerHTML = '<span>🙈</span> 日本語訳を隠す';
    }
  }

  // ===== SPEED =====
  function updateSpeed(val) {
    speechSpeed = parseFloat(val);
    document.getElementById("speedDisplay").textContent = speechSpeed.toFixed(1) + "×";
    if (currentAudio) currentAudio.playbackRate = speechSpeed;
  }

  // ===== NAVIGATION =====
  function cancelSpeech() {
    isSpeaking = false;
    chunkQueue = [];
    if (currentAudio) { currentAudio.pause(); currentAudio.src = ""; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const btn = document.getElementById("listenBtn");
    if (btn) btn.innerHTML = '<span class="btn-icon">🔊</span><span>お手本を聞く</span>';
  }

  function nextSentence() {
    cancelSpeech();
    if (currentIdx < sentences.length - 1) {
      currentIdx++;
      renderSentence();
    } else {
      showCompletion();
    }
  }

  function prevSentence() {
    cancelSpeech();
    if (currentIdx > 0) {
      currentIdx--;
      renderSentence();
    }
  }

  function showCompletion() {
    document.getElementById("sentenceCard").style.display = "none";
    document.getElementById("completionBanner").classList.add("show");
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressPct").textContent = "100%";
  }

  function restartSet() {
    currentIdx = 0;
    document.getElementById("completionBanner").classList.remove("show");
    document.getElementById("sentenceCard").style.display = "";
    renderSentence();
  }

  // ===== UTIL =====
  function setStatus(msg, type) {
    const el = document.getElementById("statusMsg");
    el.textContent = msg;
    el.className = "status-msg" + (type ? " " + type : "");
  }

  // Start
  init();
</script>
</body>
</html>
